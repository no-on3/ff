[package]
name = "ff-cli"
version = "0.1.0"
edition = "2021"
description = "CLI tool for packaging and deploying lambda functions to FF platform"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
tokio = { version = "1.32", features = ["full"] }
zip = "0.6"
walkdir = "2.4"
anyhow = "1.0"
thiserror = "1.0"
dotenv = "0.15"
s3 = "0.33"
env_logger = "0.10"
log = "0.4"
indicatif = "0.17"
colored = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
