# What the platform finds outside the cluster in the test: PostgreSQL, S3 and Mailpit, as containers on the
# cluster's Docker network. Services without a selector, whose EndpointSlices hack/e2e-platform.sh writes.
apiVersion: v1
kind: Service
metadata:
  name: ff-test-postgres
  namespace: ff-system
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ff-test-s3
  namespace: ff-system
spec:
  ports:
    - name: s3
      port: 8333
---
apiVersion: v1
kind: Service
metadata:
  name: ff-test-smtp
  namespace: ff-system
spec:
  ports:
    - name: smtp
      port: 1025
