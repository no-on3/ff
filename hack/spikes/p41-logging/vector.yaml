# P-41 spike: Vector 0.58.0 (2026-08-26; 0.59.0 was under two weeks old) as a DaemonSet. It reads the function
# containers of FF's tenant namespaces (and, for the spike, only the namespaces run.sh names in __NAMESPACES__), adds
# the tenant, the function and each line's call, keeps __LIMIT__ lines a second per namespace, cuts long lines, and
# writes to VictoriaLogs. run.sh fills in the placeholders and deletes it all after. The limit counts the lines' own
# seconds, in Lua: Vector's throttle counts the seconds it processes them in, so a backlog read after a restart would
# use up a namespace's budget at once and be dropped.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vector
  namespace: ff-logging-spike
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ff-logging-spike-vector
rules:
  - apiGroups: [""]
    resources: [pods, namespaces, nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ff-logging-spike-vector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ff-logging-spike-vector
subjects:
  - kind: ServiceAccount
    name: vector
    namespace: ff-logging-spike
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector
  namespace: ff-logging-spike
data:
  vector.yaml: |
    data_dir: /vector-data-dir
    sources:
      pods:
        type: kubernetes_logs
        # FF labels each tenant namespace it creates; the API server filters, so nothing else is even listed.
        extra_namespace_label_selector: app.kubernetes.io/managed-by=ff-controller
        # A new pod's log file is found within a second (60 s by default): a cold start's lines arrive at once.
        glob_minimum_cooldown_ms: 1000
        # A line over 16 KiB comes in parts, which Vector merges; past max_line_bytes (32 KiB by default) it would drop
        # the whole line. Cut at 64 KiB instead, and the remap below cuts to 16,384 characters.
        max_merged_line_bytes: 65536
        max_merged_line_action: truncate
    transforms:
      ours:
        type: filter
        inputs: [pods]
        condition: 'includes(__NAMESPACES__, .kubernetes.pod_namespace) && .kubernetes.container_name == "function"'
      shape:
        type: remap
        inputs: [ours]
        source: |
          .namespace = .kubernetes.pod_namespace
          .pod = .kubernetes.pod_name
          .function_id = .kubernetes.pod_labels."ff.dev/function-id"
          # Long lines are cut, in characters, and say so (D10).
          .message = truncate(to_string(.message) ?? "", limit: 16384, suffix: " …[truncated]")
          .time = .timestamp
          .log_second = to_unix_timestamp(timestamp(.timestamp) ?? now())
          del(.kubernetes)
          del(.file)
          del(.source_type)
          del(.timestamp)
          del(.timestamp_end)
      requests:
        # An instance runs one call at a time (D14): a call's lines run from its START line to its REPORT.
        # Then each namespace keeps __LIMIT__ lines a second of the lines' own time.
        type: lua
        inputs: [shape]
        version: "2"
        hooks:
          process: process
        source: |
          local LIMIT = __LIMIT__
          local current = {}
          local counts = {}
          local newest = 0
          local seen = 0
          function process(event, emit)
            local log = event.log
            local kind, id = string.match(log.message or "", "^(%u+) RequestId: (%S+)")
            if kind == "START" or kind == "END" or kind == "REPORT" then
              log.request_id = id
              if kind == "REPORT" then current[log.pod] = nil else current[log.pod] = id end
            elseif current[log.pod] then
              log.request_id = current[log.pod]
            end
            local second = log.log_second or 0
            log.log_second = nil
            local key = (log.namespace or "") .. ":" .. second
            counts[key] = (counts[key] or 0) + 1
            if second > newest then newest = second end
            seen = seen + 1
            if seen % 10000 == 0 then
              for k, _ in pairs(counts) do
                local s = tonumber(string.match(k, ":(%d+)$"))
                if s and s < newest - 120 then counts[k] = nil end
              end
            end
            if counts[key] <= LIMIT then emit(event) end
          end
    sinks:
      vlogs:
        type: http
        inputs: [requests]
        uri: http://victoria-logs.ff-logging-spike.svc:9428/insert/jsonline?_stream_fields=namespace,function_id&_msg_field=message&_time_field=time
        encoding:
          codec: json
        framing:
          method: newline_delimited
        batch:
          timeout_secs: 0.5
        healthcheck:
          enabled: false
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector
  namespace: ff-logging-spike
spec:
  selector:
    matchLabels:
      app: vector
  template:
    metadata:
      labels:
        app: vector
    spec:
      serviceAccountName: vector
      containers:
        - name: vector
          image: timberio/vector:0.58.0-distroless-libc
          args: [--config, /etc/vector/vector.yaml]
          env:
            - name: VECTOR_SELF_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /etc/vector
              readOnly: true
            - name: var-log
              mountPath: /var/log
              readOnly: true
            - name: data
              mountPath: /vector-data-dir
      volumes:
        - name: config
          configMap:
            name: vector
        - name: var-log
          hostPath:
            path: /var/log
        - name: data
          hostPath:
            path: /var/lib/ff-logging-spike/vector
            type: DirectoryOrCreate
