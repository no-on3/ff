# The developer tools' spike of `ff local`'s front doors: S3's PutObject, GetObject and ListObjectsV2 and SQS's
# SendMessage, ReceiveMessage and DeleteMessage, ported from the backend's into Rust, their tests reading the tables the
# backend's own tests read. A crate of its own, outside the ff command's, with the dependencies ff has already.
[package]
name = "local-front-door-spike"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
base64 = "0.23"
crc32fast = "1.5"
ring = "0.17"
serde_json = "1"
