[package]
name = "ff"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "The ff command: deploy, invoke and read FF's functions through its API"
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
