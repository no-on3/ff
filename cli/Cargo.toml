[package]
name = "ff"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "The ff command: deploy, invoke and read FF's functions through its API"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
ctrlc = "3.5"
directories = "6.0"
getrandom = "0.4"
humantime = "2.4"
notify = "8.2"
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true
