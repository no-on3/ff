[package]
name = "ff"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
description = "The ff command: deploy, invoke and read FF's functions through its API"
license = "UNLICENSED"
publish = false

[dependencies]
base64 = "0.23"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
# A package's zip: deflate (pure Rust, miniz_oxide) and each entry's CRC-32.
crc32fast = "1.5"
ctrlc = "3.5"
directories = "6.0"
flate2 = "1.1"
getrandom = "0.4"
humantime = "2.4"
notify = "8.2"
# A package's SHA-256, as AWS Lambda's CodeSha256: rustls's own, already built in.
ring = "0.17"
rpassword = "7.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
ureq = { version = "3.4", default-features = false, features = ["rustls", "platform-verifier"] }
# A SAM template's YAML, read from its parser's events as CloudFormation reads it (ADR 0016): a template is UTF-8 text,
# so without the decoder of other encodings.
yaml-rust2 = { version = "0.13", default-features = false }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27"

[profile.release]
lto = true
codegen-units = 1
strip = true

# The ff suite's build (hack/cli-e2e.sh): release's, without the optimizations made across the whole program at link
# time, which take most of a build after each commit (the commit is built in, so every commit builds ff again).
[profile.e2e]
inherits = "release"
lto = false
codegen-units = 16
