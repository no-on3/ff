# Each job's setup, after its checkout: Node.js at the images' version, with npm's downloads kept between runs, and,
# for a job that builds the ff command, Cargo's downloads and its build, each such job's own, since clippy's, the
# tests' and the release's builds differ. Pinned as the workflow's actions are.
name: setup
description: Node.js with npm's cache, and Cargo's cache for a job that builds ff
inputs:
  lockfiles:
    description: The npm lockfiles the job's stages install from, one per line; none for a job that installs nothing
    default: BE/package-lock.json
  cargo:
    description: The name of the job's Cargo cache, for a job that builds ff; none for the others
    default: ''
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0 # the images'
        cache: ${{ inputs.lockfiles != '' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.lockfiles }}
    # Keyed by the toolchain and the lockfile: a run whose lockfile changed starts from the last build with the same
    # toolchain and builds only what changed; a new toolchain starts afresh.
    - if: inputs.cargo != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          cli/target
        key: cargo-${{ inputs.cargo }}-${{ hashFiles('cli/rust-toolchain.toml') }}-${{ hashFiles('cli/Cargo.lock') }}
        restore-keys: cargo-${{ inputs.cargo }}-${{ hashFiles('cli/rust-toolchain.toml') }}-
