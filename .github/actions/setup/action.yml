# Each job's setup, after its checkout: Node.js at the images' version, with npm's downloads kept between runs, and,
# for a job that builds the ff command, Cargo's downloads and its build, each such job's own, since clippy's, the
# tests' and the release's builds differ; for the ff suite, the AWS tools it checks an export with; for a job that
# builds images or runs a cluster, the room they need. Pinned as the workflow's actions are.
name: setup
description: Node.js with npm's cache, Cargo's cache for a job that builds ff, the ff suite's AWS tools, and room for images
inputs:
  lockfiles:
    description: The npm lockfiles the job's stages install from, one per line; none for a job that installs nothing
    default: BE/package-lock.json
  cargo:
    description: The name of the job's Cargo cache, for a job that builds ff; none for the others
    default: ''
  room:
    description: Whether the job builds images or runs a cluster, which need more room than a runner leaves free
    default: 'false'
  aws-tools:
    description: Whether the job checks an export with the SAM CLI and OpenTofu, which hack/install-tools.sh installs
    default: 'false'
runs:
  using: composite
  steps:
    # A runner leaves 13 GB free, and the images and the cluster need more once they are built (hack/check-resources.sh
    # checks before each suite): the tools a job here never uses, 18 GB, removed while the setup and the build go on,
    # since removing them took 40 to 110 s in a step of its own. The runner ends the removal with the job, if need be.
    - if: inputs.room == 'true'
      shell: bash
      run: |
        df -h /
        sudo sh -c 'nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL >/dev/null 2>&1 &'
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24.21.0 # the images'
        cache: ${{ inputs.lockfiles != '' && 'npm' || '' }}
        cache-dependency-path: ${{ inputs.lockfiles }}
    # Keyed by the toolchain, the lockfile and the manifest, whose profiles say how ff is built: a run whose lockfile
    # or manifest changed starts from the last build with the same toolchain and builds only what changed, and is kept
    # under its own key, as a cache found under its key is never written again; a new toolchain starts afresh.
    - if: inputs.cargo != ''
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry/index
          ~/.cargo/registry/cache
          ~/.cargo/git/db
          cli/target
        key: cargo-${{ inputs.cargo }}-${{ hashFiles('cli/rust-toolchain.toml') }}-${{ hashFiles('cli/Cargo.lock', 'cli/Cargo.toml') }}
        restore-keys: cargo-${{ inputs.cargo }}-${{ hashFiles('cli/rust-toolchain.toml') }}-
    # The SAM CLI, OpenTofu and AWS's provider, 480 MB together, as hack/install-tools.sh pins them: keyed by that
    # script, which installs them again only when a version it pins changes, and then is kept under its new key.
    - if: inputs.aws-tools == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          hack/bin/tofu
          hack/bin/sam
          hack/.sam
          hack/.terraform/mirror
        key: aws-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('hack/install-tools.sh') }}
