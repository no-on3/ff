# FF's pipeline: each job one stage of hack/ci.sh, which runs the same commands on a laptop. GitHub runs it, and
# so does a self-hosted Gitea with Gitea Actions, which reads this directory when it has no .gitea/workflows.
# Actions are pinned to the commit of a release at least two weeks old when chosen; Node.js to the images' version,
# in .github/actions/setup, each job's setup, with its caches. Each upload of an artifact has 5 minutes: on 2026-10-31
# one hung until its job's own limit, 39 minutes later, and GitHub kept none of that job's log.
name: ci

on:
  push:
    branches: [master, main] # the repository's main branch is master; a host may name it main
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run: all; nightly, as the schedule runs them, with its issue; or names, comma-separated'
        default: all
  schedule:
    - cron: '17 2 * * *' # nightly: the platform deployed on a cluster of its own; the other jobs ran on the commit's push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The ff command's build starts from the cache (.github/actions/setup), never from an edit before it: incremental
  # compilation's files would only weigh the cache down, and line tables are enough for a failed test's backtrace.
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # A runner runs one job alone: the load is that job's own steps, the disk's clean-up in the background among them,
  # and waiting frees nothing. hack/check-resources.sh reports it there without refusing on it, and still checks the
  # disk and the memory; its limit on the load is for a machine shared with other work, as a laptop is.
  MAX_LOAD_FACTOR: 'off'

jobs:
  # Whether the commits change more than the documents (hack/lib/changes.sh): a push or a pull request that changes
  # only them runs static alone, which checks them and the history's secrets; a run started by hand, the jobs it names.
  changes:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # both ends of the comparison
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: hack/lib/changes.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"

  static:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',static,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: ./.github/actions/setup
        with:
          lockfiles: |
            BE/package-lock.json
            FE/package-lock.json
            admin/package-lock.json
            runtimes/nodejs/package-lock.json
          cargo: static
      - run: hack/ci.sh deps static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  unit:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',unit,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          lockfiles: |
            BE/package-lock.json
            FE/package-lock.json
            admin/package-lock.json
            runtimes/nodejs/package-lock.json
          cargo: unit
          aws-tools: sam # the SAM CLI, which lints the SAM fixtures
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13' # the Python runtime's
      - run: hack/ci.sh deps unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  db:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',db,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - run: hack/ci.sh deps db
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  # The images built once: scanned, then run as the cluster runs them, and the manifests checked with the edge's, from
  # Docker's build cache, where the scans left every layer; at once with static, unit and db, needing none of them.
  security:
    name: security, then the images run
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',security,') || contains(format(',{0},', inputs.jobs), ',images,')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          room: true
      - run: hack/ci.sh deps security images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        timeout-minutes: 5
        with:
          name: sbom
          path: hack/.ci/sbom/
          if-no-files-found: ignore

  # The cluster's stages, each on a runner of its own, at once (hack/ci.sh cluster runs them in a row, on a laptop,
  # with images, which runs in security's job here): a failure in one is known within that stage's own time, and every
  # stage's failures are reported.
  cluster:
    needs: [changes, static, unit, db]
    # After the three it needs, or without them when a run started by hand names a stage alone.
    if: ${{ !cancelled() && needs.static.result != 'failure' && needs.unit.result != 'failure' && needs.db.result != 'failure' && needs.changes.outputs.code != 'false' && github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || contains(format(',{0},', inputs.jobs), ',cluster,') || contains(format(',{0},', inputs.jobs), ',l3,') || contains(format(',{0},', inputs.jobs), ',l4,') || contains(format(',{0},', inputs.jobs), ',l5,') || contains(format(',{0},', inputs.jobs), ',cli,') || contains(format(',{0},', inputs.jobs), ',aws-tools,')) }}
    name: ${{ matrix.stage }}
    strategy:
      fail-fast: false # every stage's failures, not only the first stage's
      matrix:
        include: # each one's time limit, from its time on 2026-10-24's runner with room
          - { stage: l3, minutes: 20 }
          - { stage: l4, minutes: 30 }
          - { stage: l5, minutes: 20 }
          - { stage: cli, minutes: 30 }
          - { stage: aws-tools, minutes: 30 }
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      # A run started by hand runs the stages it names, or all of them for "cluster".
      - id: wanted
        env:
          JOBS: ${{ inputs.jobs }}
          STAGE: ${{ matrix.stage }}
        run: |
          case ",$JOBS," in
            ,, | ,all, | *,cluster,* | *",$STAGE,"*) echo run=true ;;
            *) echo run=false ;;
          esac >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.wanted.outputs.run == 'true'
      - uses: ./.github/actions/setup
        if: steps.wanted.outputs.run == 'true'
        with:
          # The ff suite and AWS's tools' build ff alike, with the e2e profile: one cache.
          cargo: ${{ (matrix.stage == 'cli' || matrix.stage == 'aws-tools') && 'cli' || '' }}
          aws-tools: ${{ matrix.stage == 'cli' && 'export' || matrix.stage == 'aws-tools' && 'terraform' || '' }}
          room: true
      - if: steps.wanted.outputs.run == 'true'
        run: hack/ci.sh deps ${{ matrix.stage }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.wanted.outputs.run == 'true' # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ matrix.stage }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  platform:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' ||
      inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',platform,')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          lockfiles: '' # the platform's suite installs nothing with npm ci: no cache of its own
          room: true
      - run: hack/ci.sh deps platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  # The branch's last SBOMs and the lockfiles checked again with the day's advisories (hack/ci.sh advisories): an image
  # or a package unchanged since its push can have a new one, and the nightly builds no image.
  advisories:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' ||
      inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',advisories,')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the SBOMs of the branch's last security job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          lockfiles: '' # npm audit reads the lockfiles: nothing is installed
      - run: hack/lib/last-sboms.sh "$GITHUB_REF_NAME" hack/.ci/sbom
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - run: hack/ci.sh deps advisories
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # the report of its steps
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  # The latest release of each tool the tests pin, tried as the pinned ones run (hack/ci.sh tools): a change of theirs
  # is seen the night it comes out, before a pin moves.
  tools:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' ||
      inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',tools,')))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
        with:
          lockfiles: '' # the spike installs the SDK it tries itself
      - run: hack/ci.sh deps tools
        env:
          GH_TOKEN: ${{ github.token }} # the tools' releases on GitHub
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # the versions tried, the spike's log and what each tool sent, and the report of its steps
        timeout-minutes: 5
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/tools/latest.env
            hack/.ci/tools/spike.log
            hack/.ci/tools/recordings/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  # The ff command built for Linux and Windows on Linux, and for macOS on macOS, which Linux can't link
  # (hack/spikes/cross-build/), then each build run on its own system, and ff's tests run there with that system's own
  # toolchain: the developer tools' spike, which only a run started by hand that names it runs (jobs=cross), its
  # findings in its README.
  cross-build:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.jobs), ',cross,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hack/spikes/cross-build/run.sh
        env:
          TARGETS: x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-gnu
          CARGO_BUILD_JOBS: 4 # the runner's processors, which it runs alone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() # the builds, the results and each build's log, a failed one's too
        timeout-minutes: 5
        with:
          name: cross-builds
          path: |
            hack/.spike-cross-build/dist/
            hack/.spike-cross-build/results.md
            hack/.spike-cross-build/logs/
          retention-days: 7
          if-no-files-found: ignore

  cross-build-macos:
    if: ${{ github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.jobs), ',cross,') }}
    runs-on: macos-15 # arm64, building for both processors
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hack/spikes/cross-build/macos.sh
        env:
          CARGO_BUILD_JOBS: 3 # the runner's processors, which it runs alone
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        timeout-minutes: 5
        with:
          name: cross-builds-macos
          path: |
            hack/.spike-cross-build/dist/
            hack/.spike-cross-build/results-macos.md
            hack/.spike-cross-build/logs/
          retention-days: 7
          if-no-files-found: ignore

  cross-run:
    needs: [cross-build, cross-build-macos]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && contains(format(',{0},', inputs.jobs), ',cross,') }}
    name: cross ${{ matrix.system }}
    strategy:
      fail-fast: false # every system's results
      matrix:
        include:
          - { system: windows-x86_64, runner: windows-2025, binary: ff-x86_64-pc-windows-gnu.exe }
          - { system: macos-arm64, runner: macos-15, binary: ff-aarch64-apple-darwin }
          - { system: macos-x86_64, runner: macos-15-intel, binary: ff-x86_64-apple-darwin }
          - { system: linux-arm64, runner: ubuntu-24.04-arm, binary: ff-aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash # Git's bash on Windows
    steps:
      # Windows' Git checks text out with CRLF line endings, which ff's tests, comparing files they embed with what they
      # expect, read as changes: the files as the repository holds them, to see what else differs on Windows.
      - if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cross-builds*
          merge-multiple: true
          path: cross-builds
      # Both steps run whatever the other's outcome, and the last fails the job if either failed.
      - id: binary
        continue-on-error: true
        run: hack/spikes/cross-build/smoke.sh "cross-builds/dist/${{ matrix.binary }}"
      - id: tests
        continue-on-error: true
        working-directory: cli
        run: cargo test --locked --no-fail-fast # every test binary's failures, not the first one's alone
      - if: steps.binary.outcome != 'success' || steps.tests.outcome != 'success'
        env:
          BINARY: ${{ steps.binary.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          echo "The binary: $BINARY; ff's tests: $TESTS" | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

  # A red nightly opens an issue, or comments on the one open, and a green one closes it (hack/lib/nightly-issue.sh):
  # GitHub itself e-mails only whoever last changed this file.
  nightly-report:
    needs: [platform, advisories, tools]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.jobs == 'nightly')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read # the failed jobs' logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hack/lib/nightly-issue.sh
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
