# FF's pipeline: each job one stage of hack/ci.sh, which runs the same commands on a laptop. GitHub runs it, and
# so does a self-hosted Gitea with Gitea Actions, which reads this directory when it has no .gitea/workflows.
# Actions are pinned to the commit of a release at least two weeks old when chosen; Node.js to the images' version.
name: ci

on:
  push:
    branches: [master, main] # the repository's main branch is master; a host may name it main
  pull_request:
  workflow_dispatch:
    inputs:
      jobs:
        description: 'The jobs to run: all; nightly, as the schedule runs them, with its issue; or names, comma-separated'
        default: all
  schedule:
    - cron: '17 2 * * *' # nightly: the platform deployed on a cluster of its own

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24.21.0

jobs:
  static:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',static,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: hack/ci.sh deps static
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  unit:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',unit,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13' # the Python runtime's
      - run: hack/ci.sh deps unit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  db:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',db,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: hack/ci.sh deps db
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  security:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',security,') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: hack/ci.sh deps security
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: sbom
          path: hack/.ci/sbom/
          if-no-files-found: ignore

  # The cluster's five stages, each on a runner of its own, at once (hack/ci.sh cluster runs them in a row, on a
  # laptop): a failure in one is known within that stage's own time, and every stage's failures are reported.
  cluster:
    needs: [static, unit, db]
    # After the three it needs, or without them when a run started by hand names a stage alone.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && (github.event_name != 'workflow_dispatch' || inputs.jobs == 'all' || inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',cluster,') || contains(format(',{0},', inputs.jobs), ',l3,') || contains(format(',{0},', inputs.jobs), ',l4,') || contains(format(',{0},', inputs.jobs), ',l5,') || contains(format(',{0},', inputs.jobs), ',cli,') || contains(format(',{0},', inputs.jobs), ',images,')) }}
    name: ${{ matrix.stage }}
    strategy:
      fail-fast: false # every stage's failures, not only the first stage's
      matrix:
        include: # each one's time limit, from its time on 2026-10-24's runner with room
          - { stage: l3, minutes: 20 }
          - { stage: l4, minutes: 30 }
          - { stage: l5, minutes: 20 }
          - { stage: cli, minutes: 30 }
          - { stage: images, minutes: 20 }
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    steps:
      # A run started by hand runs the stages it names, or all of them for "cluster".
      - id: wanted
        env:
          JOBS: ${{ inputs.jobs }}
          STAGE: ${{ matrix.stage }}
        run: |
          case ",$JOBS," in
            ,, | ,all, | ,nightly, | *,cluster,* | *",$STAGE,"*) echo run=true ;;
            *) echo run=false ;;
          esac >>"$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.wanted.outputs.run == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.wanted.outputs.run == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
      # The images and the cluster need more room than a runner leaves free (hack/check-resources.sh).
      - if: steps.wanted.outputs.run == 'true'
        run: df -h / && sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - if: steps.wanted.outputs.run == 'true'
        run: hack/ci.sh deps ${{ matrix.stage }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() && steps.wanted.outputs.run == 'true' # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ matrix.stage }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  platform:
    if: >-
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.jobs == 'all' ||
      inputs.jobs == 'nightly' || contains(format(',{0},', inputs.jobs), ',platform,')))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: hack/ci.sh deps platform
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure() # what the failed run left behind (hack/lib/evidence.sh), and the report of its steps and checks
        with:
          name: failure-${{ github.job }}
          path: |
            hack/.ci/failure/
            hack/.ci/report.md
          retention-days: 7
          if-no-files-found: ignore

  # A red nightly opens an issue, or comments on the one open, and a green one closes it (hack/lib/nightly-issue.sh):
  # GitHub itself e-mails only whoever last changed this file.
  nightly-report:
    needs: [static, unit, db, security, cluster, platform]
    if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.jobs == 'nightly')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read # the failed jobs' logs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: hack/lib/nightly-issue.sh
        env:
          RESULTS: ${{ toJSON(needs) }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
