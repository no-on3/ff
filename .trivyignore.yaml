# Vulnerabilities hack/ci.sh's image scans accept, each in the one binary or package named, with why, and until when:
# from expired_at on, the scan reports it again. Anything else, anywhere, fails the scan.
vulnerabilities:
  - id: CVE-2026-78661
    paths: [usr/bin/caddy]
    statement: >-
      golang.org/x/net v0.60.0 in Caddy, which the console's, the admin app's and the edge's images build: a denial of service in x/net/html's parser. Their Caddyfiles serve built files and proxy requests, and none turns on a handler that parses HTML (templates, or a response body's rewrite): nothing reaches it. Fixed in v0.62.0 (2026-10-27), two weeks old on 2026-11-10: Caddy built with it then.
    expired_at: 2026-11-10
  - id: CVE-2026-78661
    paths: [usr/local/bin/wal-g]
    statement: >-
      WAL-G v3.0.9, the latest release (2026-08-20), was built with golang.org/x/net v0.58.0: a denial of service in x/net/html's parser. Here WAL-G reaches the second site's S3 and serves nothing, parsing no HTML: accepted, as its other advisories are, until a release built with v0.62.0 or newer, or WAL-G built from source with it (a cgo build, for libsodium). Only the reference servers of deploy/backup and deploy/data-db run it.
    expired_at: 2026-11-20
  - id: CVE-2026-85091
    purls: [pkg:apk/alpine/zlib@1.3.2-r0]
    statement: >-
      Alpine's zlib 1.3.2-r0 in the backend's image (node:24.21.0-alpine3.24) and the cache's (valkey/valkey:9.1.2-alpine3.24): a heap overflow in gz_vacate, one of zlib's gzFile functions, which read and write .gz files. In the backend's, apk alone links it, and apk never runs once built (Node.js carries its own zlib); in the cache's, Alpine's Node.js links it for the agent, which compresses nothing, and Node.js's zlib module calls deflate and inflate, never a gzFile: nothing reaches it. Fixed in 1.3.2-r1, in alpine:3.24.3, which the images on plain Alpine moved to; Alpine's repository has 1.4-r0 now (2026-11-06), two weeks old on 2026-11-20, and Node.js's image with the fix, node:24.22.2-alpine3.24 (2026-11-05), on 2026-11-19: one or the other then.
    expired_at: 2026-11-20
  - id: CVE-2026-111943
    paths: [usr/local/bin/wal-g]
    statement: >-
      WAL-G v3.0.9, the latest release (2026-08-20), was built with Go 1.25.11: crypto/x509 may accept a chain through untrusted intermediates, a man in the middle of its TLS to the second site's S3. What it sends there is encrypted and authenticated with libsodium before it leaves the server (WALG_LIBSODIUM_KEY), so such a man reads nothing, and a backup changed on the way fails at its restore, which the monthly drill runs: accepted, not shown harmless, until a release built with Go 1.26.10 or newer, or WAL-G built from source with it (a cgo build, for libsodium). Only the reference servers of deploy/backup and deploy/data-db run it.
    expired_at: 2026-11-20
  - id: CVE-2026-84304
    paths: [usr/local/bin/wal-g]
    statement: >-
      WAL-G v3.0.9, the latest release (2026-08-20), was built with Go 1.25.11 and gRPC 1.83.0. Here it only talks to the second site's S3, over TLS, and serves nothing, which narrows what these reach: accepted, not shown harmless, until a release built with Go 1.26.6 or newer, or WAL-G built from source with it (a cgo build, for libsodium). Only the reference servers of deploy/backup and deploy/data-db run it.
    expired_at: 2026-11-20
