# Vulnerabilities hack/ci.sh's image scans accept, each in the one binary named, with why, and until when:
# from expired_at on, the scan reports it again. Anything else, anywhere, fails the scan.
vulnerabilities:
  - id: CVE-2026-78667
    paths: [usr/bin/caddy]
    statement: >-
      Caddy 2.11.7, the latest release, in the console's, the admin app's and the edge's images, was built with Go 1.26.8 and golang.org/x/net v0.59.0: denial of service through HTTP/2 and TLS. Go 1.26.9 (2026-10-10) and x/net v0.60.0 (2026-10-08) fix them, and are two weeks old on 2026-10-24: Caddy is rebuilt with them then, or replaced by a newer release that has them. Nothing is in production before then.
    expired_at: 2026-10-24
