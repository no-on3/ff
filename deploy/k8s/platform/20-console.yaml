# The console: its static build (the ff-console image, its addresses baked in), served on 8080. Two replicas, so a
# rollout or a node going leaves it up.
apiVersion: v1
kind: Service
metadata:
  name: ff-console
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-console
    app.kubernetes.io/part-of: ff
spec:
  selector:
    app.kubernetes.io/name: ff-console
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-console
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-console
    app.kubernetes.io/part-of: ff
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ff-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ff-console
        app.kubernetes.io/part-of: ff
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: console
          image: ff-console
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
