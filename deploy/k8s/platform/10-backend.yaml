# The backend in ff-system, as the ServiceAccount ff-controller (base/), which may manage the tenants'
# namespaces and nothing else. One replica: its jobs (the rating, the alarms, the notifications) take their work
# with row locks, so a second would be safe, but the beta needs one. It calls functions' Services directly
# (K8S_INVOKE_MODE=direct). Its settings are the ConfigMap ff-backend (backend.env) and the Secret ff-backend,
# which the deployment writes (deploy/k8s/README.md): DB_PASSWORD, FF_OBJECT_STORE_ACCESS_KEY, FF_OBJECT_STORE_SECRET_KEY,
# FF_SMTP_URL; and the keys that encrypt functions' variables and secrets, the Secret ff-encryption-keys, as a
# file. It refuses to start on a schema with pending migrations: deploy.sh runs the migrations Job first. Functions'
# URLs are answered on a port of their own, 3001, buckets' S3 requests on another, 3002, and queues' SQS requests on
# a third, 3003, which the edge reaches, and functions too, with their own keys, through the Service ff-storage;
# buckets' sites on a fourth, 3004, which the edge alone reaches.
apiVersion: v1
kind: Service
metadata:
  name: ff-backend
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-backend
    app.kubernetes.io/part-of: ff
spec:
  selector:
    app.kubernetes.io/name: ff-backend
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: function-urls
      port: 3001
      targetPort: function-urls
    - name: storage
      port: 3002
      targetPort: storage
    - name: sqs
      port: 3003
      targetPort: sqs
    - name: website
      port: 3004
      targetPort: website
---
# Buckets' S3 front door as functions reach it with their own keys (ADR 0009), at the address that the backend's
# FF_STORAGE_FUNCTION_ENDPOINT names: an IP address, where AWS's SDKs address buckets path-style by themselves, so that
# no name of FF's is needed inside the cluster; and queues' SQS endpoint at the same address (ADR 0010), as
# FF_SQS_FUNCTION_ENDPOINT names it. A fixed one, in the band of the cluster's Service range that Kubernetes keeps for
# fixed addresses, beside the code registry's: k3s's range is 10.43.0.0/16; an overlay gives one of another.
apiVersion: v1
kind: Service
metadata:
  name: ff-storage
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-backend
    app.kubernetes.io/part-of: ff
spec:
  clusterIP: 10.43.0.251
  selector:
    app.kubernetes.io/name: ff-backend
  ports:
    - name: storage
      port: 3002
      targetPort: storage
    - name: sqs
      port: 3003
      targetPort: sqs
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-backend
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-backend
    app.kubernetes.io/part-of: ff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ff-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ff-backend
        app.kubernetes.io/part-of: ff
    spec:
      serviceAccountName: ff-controller
      # Its token for the cluster's API is asked for an hour, and the kubelet renews it before then; the backend
      # reads the file again every minute. The token Kubernetes mounts by default would be valid for a year, as long
      # as the pod lives, in whoever's hands it is.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The Secrets it reads as files are its group's (mode 0440), not the world's: this makes it their group.
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # A stopping backend finishes its calls: the longest a function may run, 15 minutes, would be too long a
      # rollout, so calls cut off are marked lost by the next backend, and not billed.
      terminationGracePeriodSeconds: 60
      containers:
        - name: backend
          image: ff-backend
          envFrom:
            - configMapRef:
                name: ff-backend
            - secretRef:
                name: ff-backend
          ports:
            - name: http
              containerPort: 3000
            # FF_FUNCTION_URL_PORT
            - name: function-urls
              containerPort: 3001
            # FF_STORAGE_PORT
            - name: storage
              containerPort: 3002
            # FF_SQS_PORT
            - name: sqs
              containerPort: 3003
            # FF_WEBSITE_PORT
            - name: website
              containerPort: 3004
            - name: metrics
              containerPort: 9464
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: log-store-key
              mountPath: /etc/ff/victoria-logs-delete-key
              readOnly: true
            - name: encryption-keys
              mountPath: /etc/ff/encryption-keys
              readOnly: true
            - name: kube-api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        # Deleting a closed account's log lines takes the log store's key (deploy/k8s/logging).
        - name: log-store-key
          secret:
            secretName: victoria-logs-delete-key
            defaultMode: 0440
        # The keys that encrypt functions' variables and secrets at rest (FF_ENCRYPTION_KEYS_FILE): one a line.
        - name: encryption-keys
          secret:
            secretName: ff-encryption-keys
            defaultMode: 0440
        # Where the backend looks by default (K8S_TOKEN_FILE, K8S_CA_FILE): the token, and the API server's CA.
        - name: kube-api-access
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
