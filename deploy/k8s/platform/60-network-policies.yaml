# Who reaches whom. In ff-system, nothing unless allowed below or by the log store's own policy (logging/): the
# edge reaches the backend, the two apps and Keycloak; the backend reaches Keycloak for the realm's keys; the
# metrics store reaches the backend's metrics port. Tenants' pods reach none of them. The edge takes the world on
# its two ports. The API server's proxy and the kubelet's probes come from the node, which k3s lets through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ff-backend
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ff-backend
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ff-edge
      ports:
        - port: 3000
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - port: 9464
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ff-web
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [ff-console, ff-admin]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ff-edge
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-edge
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ff-edge
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ff-backend
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ff-edge
  namespace: ff-edge
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ff-edge
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: 8080
          protocol: TCP
        - port: 8443
          protocol: TCP
