# The code registry (ADR 0003): Zot, which keeps each package's code image, as the backend pushes it and the nodes
# pull it, to mount at a function's /var/task. Only the backend reaches it from a pod; the nodes pull from the
# nodes themselves, at the Service's fixed address, which their containerd is told as registry.ff.internal
# (deploy/k8s/README.md, "The code registry"). Its users are in the Secret ff-code-registry: ff-backend, which
# pushes and deletes, and ff-node, which only pulls. No backup: the backend makes an image again from its
# package's zip, which object storage keeps, when the registry has lost it; blobs nothing names any more go a day
# later. One replica, as its volume is mounted on one node.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ff-code-registry
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-code-registry
    app.kubernetes.io/part-of: ff
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ff-code-registry
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-code-registry
    app.kubernetes.io/part-of: ff
spec:
  # A fixed address, which each node's containerd is told: in the band of the cluster's Service range that
  # Kubernetes keeps for fixed addresses. k3s's range is 10.43.0.0/16; an overlay gives one of another range.
  clusterIP: 10.43.0.250
  selector:
    app.kubernetes.io/name: ff-code-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ff-code-registry
  namespace: ff-system
  labels:
    app.kubernetes.io/name: ff-code-registry
    app.kubernetes.io/part-of: ff
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ff-code-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ff-code-registry
        app.kubernetes.io/part-of: ff
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: zot
          # Zot's minimal build: the registry alone, without its user interface, search or mirroring.
          image: ghcr.io/project-zot/zot-minimal-linux-amd64:v2.1.22
          args: [serve, /etc/zot/config.json]
          ports:
            - name: registry
              containerPort: 5000
          startupProbe:
            httpGet:
              path: /startupz
              port: registry
            periodSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: registry
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: registry
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/zot
              readOnly: true
            - name: users
              mountPath: /etc/zot-auth
              readOnly: true
            - name: images
              mountPath: /var/lib/registry
      volumes:
        - name: config
          configMap:
            name: ff-code-registry
        - name: users
          secret:
            secretName: ff-code-registry
            items:
              - key: htpasswd
                path: htpasswd
        - name: images
          persistentVolumeClaim:
            claimName: ff-code-registry
