# Only the collector writes to the store, and only the backend queries it: a customer's logs reach nobody else.
# Writes and queries share port 9428, which a NetworkPolicy can't tell apart, so it admits the two and refuses
# every other pod, the tenants' first. The metrics store (deploy/k8s/monitoring) reads its /metrics there too:
# it is the operator's, as the backend is. The backend's pods carry app.kubernetes.io/name: ff-backend, as its
# production deployment labels them. The API server's Service proxy, which a backend outside the cluster uses in
# development, comes from the node: k3s lets that through.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-logs
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-logging
          podSelector:
            matchLabels:
              app.kubernetes.io/name: fluent-bit
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ff-backend
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - port: 9428
          protocol: TCP
---
# The collector serves nobody: its health page is for the kubelet, on the node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ff-logging
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# But the metrics store reads its metrics: how many lines it read, and how long they took to reach the store.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fluent-bit-metrics
  namespace: ff-logging
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: fluent-bit
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ff-monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
      ports:
        - port: 2020
          protocol: TCP
