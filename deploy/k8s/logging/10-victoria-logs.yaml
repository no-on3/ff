# VictoriaLogs v1.53.0 (2026-10-01), single node, in ff-system (D10, ADR 0005). It keeps 31 days, the longest
# plan's 30 and a day for the partition being written, and drops its oldest days first past 8 GiB of its
# 10 GiB volume. Deleting logs (/delete/*, for account closures, P-45) needs the key in the Secret
# victoria-logs-delete-key, read from a file so that it is in no command line or environment.
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: ff-system
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: ff
spec:
  selector:
    app.kubernetes.io/name: victoria-logs
  ports:
    - name: http
      port: 9428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: victoria-logs
  namespace: ff-system
  labels:
    app.kubernetes.io/name: victoria-logs
    app.kubernetes.io/part-of: ff
spec:
  serviceName: victoria-logs
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: victoria-logs
        app.kubernetes.io/part-of: ff
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoria-logs
          image: victoriametrics/victoria-logs:v1.53.0
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=31d
            - -retention.maxDiskSpaceUsageBytes=8GiB
            - -delete.enable
            - -deleteAuthKey=file:///etc/victoria-logs/delete/key
            - -loggerFormat=json
          ports:
            - name: http
              containerPort: 9428
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: delete-key
              mountPath: /etc/victoria-logs/delete
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: delete-key
          secret:
            secretName: victoria-logs-delete-key
            defaultMode: 0440
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          app.kubernetes.io/name: victoria-logs
          app.kubernetes.io/part-of: ff
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
