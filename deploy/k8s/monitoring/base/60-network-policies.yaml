# Inside ff-monitoring, each pod takes only what it is for: the store scrapes every pod; vmalert queries the
# store and tells Alertmanager; Grafana queries the store. Nothing else, a tenant's pod least of all, reaches
# any of them. A port-forward, or the API server's proxy, which come from the node, still reach Grafana.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: scraped-by-the-store
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: victoria-metrics
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: victoria-metrics
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 8428
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/part-of: ff
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: vmalert
      ports:
        - port: 9093
          protocol: TCP
