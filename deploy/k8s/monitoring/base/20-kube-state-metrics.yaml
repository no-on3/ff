# kube-state-metrics v2.20.0 (2026-08-18): the cluster's objects as metrics, for the kinds the platform runs
# on. It lists them cluster-wide, tenants' included: their pods' restarts and OOM kills, their functions'
# Deployments. It reads no Secret, no ConfigMap, and nothing inside a pod.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-state-metrics
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: ff
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ff-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: ff
rules:
  - apiGroups: [""]
    resources: [nodes, pods, namespaces, persistentvolumeclaims, resourcequotas]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ff-kube-state-metrics
  labels:
    app.kubernetes.io/part-of: ff
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ff-kube-state-metrics
subjects:
  - kind: ServiceAccount
    name: kube-state-metrics
    namespace: ff-monitoring
---
apiVersion: v1
kind: Service
metadata:
  name: kube-state-metrics
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: ff
spec:
  selector:
    app.kubernetes.io/name: kube-state-metrics
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kube-state-metrics
  namespace: ff-monitoring
  labels:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/part-of: ff
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kube-state-metrics
        app.kubernetes.io/part-of: ff
    spec:
      serviceAccountName: kube-state-metrics
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0
          args:
            - --resources=nodes,pods,namespaces,persistentvolumeclaims,resourcequotas,deployments,statefulsets,daemonsets
            - --port=8080
            - --telemetry-port=8081
          ports:
            - name: http
              containerPort: 8080
            - name: telemetry
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: telemetry
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
