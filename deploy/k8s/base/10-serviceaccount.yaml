# Identity of the FF backend when it manages tenant workloads. In development
# the backend uses a short-lived token for this account (hack/k8s/mint-token.sh),
# so development exercises the same least-privilege permissions as production.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ff-controller
  namespace: ff-system
  labels:
    app.kubernetes.io/part-of: ff
