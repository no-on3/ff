# What the FF backend may do in production. RBAC cannot scope by namespace
# label, so these rules are cluster-wide; the ff-controller-scope
# ValidatingAdmissionPolicy (40-admission-policy.yaml) restricts every write to
# FF-managed ff-t-* tenant namespaces. Reads stay cluster-wide: README.md says
# what that exposes, and why the beta accepts it. Deliberately absent: secrets,
# pods create/exec/attach, services/proxy (development only: deploy/k8s/dev),
# roles and bindings, nodes, and any escalate/bind/impersonate verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ff-controller
  labels:
    app.kubernetes.io/part-of: ff
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
