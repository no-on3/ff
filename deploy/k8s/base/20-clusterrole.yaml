# What the FF backend may do in production. RBAC cannot scope by namespace
# label, so these rules are cluster-wide; the ff-controller-scope
# ValidatingAdmissionPolicy (40-admission-policy.yaml) restricts every write to
# FF-managed ff-t-* tenant namespaces. Reads stay cluster-wide: README.md says
# what that exposes, and why the beta accepts it. Secrets are written, never
# read: no get, list or watch, anywhere. Deliberately absent: pods
# create/exec/attach, pods/log (logs come from the log store, P-43),
# services/proxy (development only: deploy/k8s/dev), roles and bindings, nodes,
# and any escalate/bind/impersonate verbs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ff-controller
  labels:
    app.kubernetes.io/part-of: ff
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete", "deletecollection"]
  - apiGroups: [""]
    resources: ["services", "resourcequotas", "limitranges"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  # Functions' environments, their variables and secrets: a pod reads its own through envFrom; the backend writes
  # them and never reads one back. The admission policy keeps these writes to tenant namespaces.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "patch", "update", "delete"]
