# The server of customers' databases (ADR 0008, README.md): its own configuration includes this file from its first
# start. What one customer's sessions may cost the others is limited here and by each user's CONNECTION LIMIT.
listen_addresses = '*'
max_connections = 200
# TLS only (pg_hba.conf refuses the rest), with TLS 1.2 at least. The certificate: a public CA's for the server's name
# in production, or one from a CA of the operator's, whose certificate functions' pods get (FF_DATA_DB_CA_FILE). In
# development, initdb/20-tls.sh makes both at the first start.
ssl = on
ssl_cert_file = '/var/lib/postgresql/tls/server.crt'
ssl_key_file = '/var/lib/postgresql/tls/server.key'
ssl_min_protocol_version = 'TLSv1.2'
# Passwords are SCRAM verifiers, which the backend computes itself: a password never reaches the server.
password_encryption = 'scram-sha-256'
hba_file = '/etc/postgresql/pg_hba.conf'
# Who connected, from where: the users are opaque names (ff_ and 24 characters), never a customer's.
log_connections = 'authentication,authorization'
# A session's temporary files: a runaway sort or join stops at 5 GB rather than fill the disk for everyone.
temp_file_limit = '5GB'
