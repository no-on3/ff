# Who may log in where, on the server of customers' databases (ADR 0008). The first line that matches decides.
# A customer's user and its database have the same opaque name (ff_ and 24 characters): "sameuser" lets each into its
# own database only. Functions come from the cluster's nodes, which masquerade what leaves the cluster; developers'
# laptops from anywhere, as RDS's "publicly accessible" option allows: TLS and SCRAM for both. In production, narrow
# ff_admin's addresses to the backend's (README.md).
# TYPE   DATABASE  USER      ADDRESS     METHOD
local    all       postgres              peer
local    all       all                   reject
hostssl  all       postgres  0.0.0.0/0   reject
hostssl  all       postgres  ::/0        reject
hostssl  postgres  ff_admin  0.0.0.0/0   scram-sha-256
hostssl  postgres  ff_admin  ::/0        scram-sha-256
hostssl  sameuser  all       0.0.0.0/0   scram-sha-256
hostssl  sameuser  all       ::/0        scram-sha-256
host     all       all       0.0.0.0/0   reject
host     all       all       ::/0        reject
