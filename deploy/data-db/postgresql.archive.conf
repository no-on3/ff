# WAL archiving to the second site with WAL-G, as FF's own server does (deploy/backup/README.md): included when
# FF_DATA_DB_ARCHIVE=on at the first start (initdb/10-settings.sh). A segment goes when it is full, and at least every
# archive_timeout; archive_command fails, and PostgreSQL keeps the segment and tries again, while the site is away.
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 300
# For a restore: PostgreSQL fetches the segments it lacks back from the site.
restore_command = 'wal-g wal-fetch %f %p'
