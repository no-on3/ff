# WAL archiving to the second site with WAL-G (deploy/backup/README.md). A segment goes when it is full, and at
# least every archive_timeout: the recovery point is never older than that, well inside the 15 minutes FF
# promises. archive_command fails, and PostgreSQL keeps the segment and tries again, while the site is away.
wal_level = replica
archive_mode = on
archive_command = 'wal-g wal-push %p'
archive_timeout = 300
# For a restore: PostgreSQL fetches the segments it lacks back from the site.
restore_command = 'wal-g wal-fetch %f %p'
