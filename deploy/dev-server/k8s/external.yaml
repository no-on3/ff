# What the platform finds beside the cluster on the development server (../docker-compose.yml): Services without a
# selector, whose EndpointSlices server.sh writes with the address they listen on, the Docker bridge's on the host.
apiVersion: v1
kind: Service
metadata:
  name: ff-dev-postgres
  namespace: ff-system
spec:
  ports:
    - name: postgres
      port: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: ff-dev-s3
  namespace: ff-system
spec:
  ports:
    - name: s3
      port: 8333
---
apiVersion: v1
kind: Service
metadata:
  name: ff-dev-smtp
  namespace: ff-system
spec:
  ports:
    - name: smtp
      port: 1025
