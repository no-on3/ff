# Deploys an application to FF from GitLab CI at each push to the default branch: copy this file into your
# repository as .gitlab-ci.yml, or its job into yours, beside the template.yaml it deploys (`ff init <name> --template
# sam` makes one, its samconfig.toml naming the stack). In the project's settings, "CI/CD", then "Variables":
#   FF_ENDPOINT        FF's API, https://api.<domain>
#   FF_DOWNLOADS_URL   FF's downloads site, https://get.<domain>
#   FF_TOKEN           masked and protected: an API key an owner of the account makes for this, with the scopes a
#                      deploy needs:
#                        ff api-keys create --name gitlab --expires 90d \
#                          --scopes stacks:read,stacks:write,functions:read,functions:write
#                      and storage:*, queues:* when the template has buckets or queues.
# ff is installed from the downloads site, its SHA-256 checked against the release's latest.json and its signature
# with minisign, which the job installs. The job fails when ff does, with ff's message last in the log: exit code 6
# is the account refusing (no credit, a key's scopes, the plan's rate), 4 a function that didn't become ready, 2 the
# command or the template, 3 the rest: the settings, the connection, the API.
stages: [deploy]

deploy-to-ff:
  stage: deploy
  image: alpine:3.24.3 # ff's Linux builds are static: any image with curl
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  resource_group: deploy-to-ff # one deploy at a time
  before_script:
    - apk add --no-cache curl jq minisign
    - curl -fsSL "$FF_DOWNLOADS_URL/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - |
      # --yes: what the template no longer has is deleted, as sam deploy does; --output json: the result as a
      # document on stdout, an error as one on stderr, after ff's warnings.
      code=0
      ff deploy template.yaml --yes --output json >deployed.json 2>ff-errors.txt || code=$?
      cat ff-errors.txt >&2
      if [ "$code" -ne 0 ]; then
        message="$(sed -n '/^{/,/^}/p' ff-errors.txt | jq -r '.error.message // "see the log"')"
        case "$code" in
          6) what="FF refused the account" ;;
          4) what="A function didn't become ready" ;;
          *) what="ff deploy failed" ;;
        esac
        echo "$what (exit $code): $message" >&2
        exit "$code"
      fi
      jq -r '.functions[]? | "\(.action) \(.logicalId): \(.name)"' deployed.json
      jq -r '.outputs[]? | "\(.name): \(.value)"' deployed.json
