version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: serverless_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    ports:
      - "9002:9002"
      - "9003:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server --console-address ":9001" /data
    volumes:
      - minio_data:/data

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus:/etc/prometheus
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana_data:/var/lib/grafana

  backend:
    build:
      context: ./BE
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./BE:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    depends_on:
      - postgres
      - minio

  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./FE:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
