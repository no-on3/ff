# Local development dependencies.
#   docker compose up -d --wait                  → PostgreSQL + S3 storage (what the backend needs)
#   docker compose --profile auth up -d --wait   → also Keycloak (login, realm "ff") and Mailpit (its e-mails)
#   docker compose --profile data up -d --wait   → also the server of customers' databases (hack/k8s/data-db-up.sh)
# The backend and the dashboard run on the host (see docs/getting-started.md).
# Functions run on the Kubernetes dev cluster (hack/k8s/cluster-up.sh), not here.
# Host ports bind to 127.0.0.1 only and can be moved: FF_PG_PORT, FF_S3_PORT,
# FF_KEYCLOAK_PORT, FF_MAIL_SMTP_PORT, FF_MAIL_UI_PORT. The data server has no host port: on Linux its own address,
# FF_DATA_DB_ADDRESS on FF_DATA_DB_SUBNET, is reachable from this machine too.

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: serverless_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${FF_PG_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d serverless_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage. SeaweedFS replaces the MinIO community
  # image, which is no longer published (ADR-002 in the parent plan, H-12).
  s3:
    image: chrislusf/seaweedfs:4.48
    command: >-
      server -dir=/data -s3 -s3.port=8333
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=256
    ports:
      - "127.0.0.1:${FF_S3_PORT:-9003}:8333"
    volumes:
      - s3_data:/data
      - ./infrastructure/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333 && wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Keycloak, the identity provider (D2), with the development realm "ff"
  # (deploy/keycloak/ff-realm.json, imported on first start). Development
  # only: start-dev, an embedded database, and the admin admin/admin.
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    profiles: [auth]
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # One issuer for tokens, whichever address the browser or curl used.
      KC_HOSTNAME: http://localhost:${FF_KEYCLOAK_PORT:-8180}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:${FF_KEYCLOAK_PORT:-8180}:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./deploy/keycloak/ff-realm.json:/opt/keycloak/data/import/ff-realm.json:ro
    mem_limit: 1g
    healthcheck:
      # The image has no curl or wget: ask the management port through bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 60

  # The server of customers' databases (ADR 0008): PostgreSQL 18, apart from FF's own, TLS and SCRAM only, on a
  # network of its own that the cluster's node joins, so that functions reach it at its address there, as the backend
  # and psql on this machine do. Its certificate comes from a CA it makes at its first start. hack/k8s/data-db-up.sh
  # starts it, joins the node to its network and prints the backend's settings. Development only: its passwords are
  # these, which production refuses.
  data-db:
    build: deploy/data-db
    image: ff-data-db:dev
    profiles: [data]
    environment:
      POSTGRES_PASSWORD: postgres
      FF_DATA_DB_ADMIN_PASSWORD: ff-data-admin-dev
      FF_DATA_DB_TLS_NAMES: "DNS:localhost,IP:127.0.0.1,IP:${FF_DATA_DB_ADDRESS:-10.199.0.10}"
    networks:
      data:
        ipv4_address: ${FF_DATA_DB_ADDRESS:-10.199.0.10}
    volumes:
      - data_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U ff_admin -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Catches every e-mail Keycloak (and later the backend) sends: http://localhost:58025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    profiles: [auth]
    ports:
      - "127.0.0.1:${FF_MAIL_SMTP_PORT:-51025}:1025"
      - "127.0.0.1:${FF_MAIL_UI_PORT:-58025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

networks:
  # Customers' database server's own (FF_DATA_DB_SUBNET), a private range as production's would be.
  data:
    ipam:
      config:
        - subnet: ${FF_DATA_DB_SUBNET:-10.199.0.0/24}

volumes:
  postgres_data:
  s3_data:
  keycloak_data:
  data_db:
